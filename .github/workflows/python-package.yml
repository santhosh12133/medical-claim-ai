name: CI

on:
  push:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install OCR engine
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr fonts-dejavu-core

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 pytest
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Lint (config in backend/setup.cfg)
        run: flake8 . --count --statistics

      - name: Unit and integration tests
        run: pytest -q

      - name: RAG quality gate (offline golden set)
        run: python scripts/evaluate_rag.py --min-hit-rate 0.95 --min-decision-accuracy 0.95 --max-unsafe-rate 0

  e2e:
    name: End-to-end (PostgreSQL + API + worker + real embeddings)
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: medical_claims
          POSTGRES_USER: medical_claims
          POSTGRES_PASSWORD: e2e-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medical_claims -d medical_claims"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://medical_claims:e2e-password@localhost:5432/medical_claims
      SECRET_KEY: e2e-only-secret-key-not-used-anywhere-else-0123456789
      AUTO_DECISION_ENABLED: "true"
      AUTO_DECISION_MIN_CONFIDENCE: "0.85"
      LOGIN_MAX_ATTEMPTS: "1000"
      TOKENIZERS_PARALLELISM: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install OCR engine
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr fonts-dejavu-core

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Migrate PostgreSQL (full rollback to base and forward again)
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic current

      - name: Seed users and demo policies (real embeddings into the SQL vector store)
        run: |
          python scripts/seed_demo_users.py
          python -m scripts.seed_demo_policies

      - name: Start API
        run: |
          nohup uvicorn main:app --host 127.0.0.1 --port 8000 > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/health/ready && break; sleep 2; done

      - name: End-to-end scenarios and throughput
        run: python scripts/e2e_check.py --claims 36 --report e2e_report.json

      - name: RAG evaluation with dense + BM25 retrieval
        run: python scripts/evaluate_rag.py --embeddings --json rag_eval_hybrid.json --min-decision-accuracy 0.95 --max-unsafe-rate 0

      - name: OCR extraction accuracy (held-out synthetic set)
        run: |
          python scripts/benchmark_extraction.py --count 120 --seed 101 --json extraction_report.json
          python scripts/benchmark_extraction.py --single-pass --count 120 --seed 101 --json extraction_report_single_pass.json

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-reports
          path: |
            backend/e2e_report.json
            backend/rag_eval_hybrid.json
            backend/extraction_report.json
            backend/extraction_report_single_pass.json
            backend/api.log
            backend/logs/

  llm-live:
    name: Live LLM check (runs only when an API key secret is configured)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: backend
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GPT_DECISION_MODEL: ${{ vars.GPT_DECISION_MODEL }}  # optional repository variable; empty = default model
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Report whether a key is configured
        id: key
        run: |
          if [ -n "$OPENAI_API_KEY$ANTHROPIC_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Live LLM check skipped::Add OPENAI_API_KEY or ANTHROPIC_API_KEY under Settings > Secrets and variables > Actions to run it."
          fi

      - name: Set up Python
        if: steps.key.outputs.present == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        if: steps.key.outputs.present == 'true'
        run: python -m pip install -r requirements.txt anthropic

      - name: Live LLM adjudication, grounded Q&A and agent planning
        if: steps.key.outputs.present == 'true'
        run: python scripts/llm_live_check.py --json llm_live_report.json

      - name: Upload report
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: llm-live-report
          path: backend/llm_live_report.json
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  security:
    name: Security scans (dependencies + static analysis)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install scanners
        run: python -m pip install pip-audit bandit

      # No ignored advisories: any known vulnerability in a backend dependency fails the build.
      - name: Python dependency vulnerabilities (pip-audit)
        run: pip-audit -r backend/requirements.txt --desc

      - name: Python static security analysis (bandit, medium+)
        if: always()
        run: bandit -r backend -x backend/tests -ll -q -c backend/bandit.yaml

      - name: Set up Node.js
        if: always()
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: npm dependency vulnerabilities (high+)
        if: always()
        working-directory: frontend
        run: npm audit --audit-level=high

  deploy-stack:
    name: Deployment stack (docker compose + smoke + browser)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create deployment .env from the template
        run: |
          cp .env.docker.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" .env
          sed -i "s/^SECRET_KEY=.*/SECRET_KEY=$(openssl rand -hex 32)/" .env

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build images
        run: docker compose build

      - name: Start stack
        run: |
          docker compose up -d
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8000/health/ready && curl -sf -o /dev/null http://localhost:8080/; then break; fi
            sleep 5
          done
          docker compose ps
          curl -sf http://localhost:8000/health/ready
          curl -sf -o /dev/null http://localhost:8080/

      - name: Seed demo users and policies inside the API container
        run: |
          docker compose exec -T api python scripts/seed_demo_users.py
          docker compose exec -T api python -m scripts.seed_demo_policies

      - name: Stack smoke test (API, frontend, CORS, auth, RAG, upload, worker, review)
        run: >-
          docker compose exec -T api python scripts/stack_smoke_test.py
          --api http://localhost:8000 --frontend http://frontend --origin http://localhost:8080 --timeout 420

      - name: Restart services and verify persistence
        run: |
          docker compose restart api worker
          for i in $(seq 1 60); do curl -sf http://localhost:8000/health/ready && break; sleep 3; done
          docker compose exec -T api python scripts/stack_smoke_test.py --persistence-only

      - name: Browser end-to-end (Playwright + Chromium)
        run: |
          docker compose exec -T api python scripts/stack_smoke_test.py --make-bill /app/logs/browser_bill.png
          docker compose cp api:/app/logs/browser_bill.png ./browser_bill.png
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python backend/scripts/browser_e2e.py --frontend http://localhost:8080 --bill browser_bill.png --out browser-e2e --timeout 420

      - name: Container logs
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color > compose.log
          tail -n 150 compose.log

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: deploy-stack
          path: |
            browser-e2e/
            compose.log

      - name: Tear down
        if: always()
        run: docker compose down -v

  server-setup:
    name: Server setup script (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64, like Oracle Ampere
            runner: ubuntu-24.04-arm
    env:
      COMPOSE: docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml
      CREDS: /root/medical-claim-ai-credentials.txt
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python (for the browser test)
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: ShellCheck deployment scripts
        run: shellcheck -S warning deploy/*.sh .devcontainer/*.sh

      - name: Fresh install with deploy/setup-server.sh (no demo users; admin + employee accounts)
        run: >-
          sudo bash deploy/setup-server.sh --domain none --public-ip localhost --app-dir "$GITHUB_WORKSPACE"
          --no-update --no-firewall --no-swap --admin-email Owner@Example.com
          --employee-email employee@example.com --employee-name "Employee Demo"

      - name: Verify the deployment through the web server
        run: |
          ADMIN_PASSWORD=$(sudo grep ' admin ' "$CREDS" | tail -1 | sed 's/.*password: //')
          echo "::add-mask::$ADMIN_PASSWORD"
          sudo deploy/verify-deployment.sh http://localhost owner@example.com "$ADMIN_PASSWORD"

      - name: Browser test through the web server (created accounts, not demo users)
        run: |
          sudo $COMPOSE exec -T api python scripts/stack_smoke_test.py --make-bill /app/logs/browser_bill.png
          sudo $COMPOSE cp api:/app/logs/browser_bill.png ./browser_bill.png
          sudo chmod a+r browser_bill.png
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          E2E_ADMIN_PASSWORD=$(sudo grep ' admin ' "$CREDS" | tail -1 | sed 's/.*password: //')
          E2E_EMPLOYEE_PASSWORD=$(sudo grep ' employee ' "$CREDS" | tail -1 | sed 's/.*password: //')
          echo "::add-mask::$E2E_ADMIN_PASSWORD"; echo "::add-mask::$E2E_EMPLOYEE_PASSWORD"
          export E2E_ADMIN_EMAIL=owner@example.com E2E_EMPLOYEE_EMAIL=employee@example.com
          export E2E_ADMIN_PASSWORD E2E_EMPLOYEE_PASSWORD
          python backend/scripts/browser_e2e.py --frontend http://localhost --bill browser_bill.png --out browser-e2e --timeout 600

      - name: Re-run the script (update path) keeps secrets, data and accounts
        run: |
          fail() { echo "[FAIL] $1"; exit 1; }
          before=$(sudo grep -E '^(POSTGRES_PASSWORD|SECRET_KEY)=' .env | sha256sum)
          sudo bash deploy/setup-server.sh --domain none --public-ip localhost --app-dir "$GITHUB_WORKSPACE" \
            --no-update --no-firewall --no-swap --admin-email owner@example.com | tee rerun.log
          after=$(sudo grep -E '^(POSTGRES_PASSWORD|SECRET_KEY)=' .env | sha256sum)
          [ "$before" = "$after" ] || fail "secrets changed"; echo "[PASS] secrets unchanged"
          grep -q "already exists; password unchanged" rerun.log || fail "admin account not kept"; echo "[PASS] admin account kept"
          [ "$(sudo grep -c ' admin ' "$CREDS")" = 1 ] || fail "second admin password issued"; echo "[PASS] no second password issued"
          ADMIN_PASSWORD=$(sudo grep ' admin ' "$CREDS" | tail -1 | sed 's/.*password: //')
          echo "::add-mask::$ADMIN_PASSWORD"
          sudo deploy/verify-deployment.sh http://localhost owner@example.com "$ADMIN_PASSWORD"

      - name: Password chosen in advance (the Oracle first-boot path)
        run: |
          fail() { echo "[FAIL] $1"; exit 1; }
          sudo MCA_EMPLOYEE_PASSWORD='chosen-in-advance-42' bash deploy/setup-server.sh --domain none --public-ip localhost \
            --app-dir "$GITHUB_WORKSPACE" --no-update --no-firewall --no-swap \
            --employee-email preset@example.com --employee-name "Preset User" | tee preset.log
          ! sudo grep -q 'preset@example.com' "$CREDS" || fail "chosen password was written to the credentials file"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost/api/auth/login -H 'Content-Type: application/json' \
            -d '{"email": "preset@example.com", "password": "chosen-in-advance-42"}')
          [ "$code" = 200 ] || fail "login with the chosen password returned $code"; echo "[PASS] login with the chosen password"
          bash -n deploy/oracle-cloud-init.sh && grep -q 'MCA_ADMIN_PASSWORD="$ADMIN_PASSWORD"' deploy/oracle-cloud-init.sh \
            && echo "[PASS] first-boot script passes the password through the environment"

      - name: Codespaces start script (simulated codespace address)
        env:
          CODESPACE_NAME: ci-demo
          GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN: app.github.dev
        run: |
          python3 -c "import json; json.load(open('.devcontainer/devcontainer.json'))"
          bash .devcontainer/start.sh | tee codespace.log
          grep -q "running at:  https://ci-demo-80.app.github.dev" codespace.log
          ADMIN_PASSWORD=$(sudo grep ' admin@demo.local ' "$CREDS" | tail -1 | sed 's/.*password: //')
          echo "::add-mask::$ADMIN_PASSWORD"
          sudo PUBLIC_ORIGIN=https://ci-demo-80.app.github.dev deploy/verify-deployment.sh http://localhost admin@demo.local "$ADMIN_PASSWORD"
          bash .devcontainer/make-sample-bill.sh && file sample-bill.png | grep -q "PNG image"

      - name: Backup check
        run: |
          fail() { echo "[FAIL] $1"; exit 1; }
          sudo BACKUP_DIR=/tmp/mca-backups deploy/backup.sh
          dump=$(sudo sh -c 'ls /tmp/mca-backups/db-*.dump' | head -1)
          sudo cat "$dump" | sudo $COMPOSE exec -T db pg_restore --list > restore-list.txt || fail "pg_restore failed"
          grep -q "TABLE DATA public claims" restore-list.txt || fail "claims table missing from dump"; echo "[PASS] database dump readable"
          sudo sh -c 'tar -tzf /tmp/mca-backups/files-*.tar.gz' | grep -q '^uploads/.' || fail "uploads missing"; echo "[PASS] uploaded files archived"

      - name: Container logs
        if: always()
        run: |
          sudo $COMPOSE ps || true
          sudo $COMPOSE logs --no-color > compose.log 2>&1 || true
          tail -n 120 compose.log || true

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: server-setup-${{ matrix.runner }}
          path: |
            browser-e2e/
            compose.log
          if-no-files-found: ignore

  codespaces:
    name: Codespaces devcontainer (built with the Dev Containers CLI)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Build and start the devcontainer (runs .devcontainer/start.sh like a codespace start)
        run: |
          npm install -g @devcontainers/cli
          devcontainer up --workspace-folder . 2>&1 | tee devcontainer.log
          grep -q "Medical Claim AI is running at" devcontainer.log

      - name: Verify the app inside the devcontainer
        run: |
          devcontainer exec --workspace-folder . bash -c '
            set -e
            sudo apt-get update -qq && sudo apt-get install -y -qq iproute2 python3 >/dev/null
            PW=$(sudo grep " admin@demo.local " /root/medical-claim-ai-credentials.txt | tail -1 | sed "s/.*password: //")
            sudo deploy/verify-deployment.sh http://localhost admin@demo.local "$PW"
            bash .devcontainer/make-sample-bill.sh'
