name: npm dependency update (temporary)

on:
  push:
    branches: ["deps/npm-audit-fix"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install react-router-dom@^7
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - name: Commit updated manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --stat
          git commit -m "chore(frontend): upgrade react-router-dom to v7" && git push --force-with-lease origin HEAD:deps/npm-audit-fix || echo "nothing to commit"
